<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ site.baseurl }}/assets/profile.jpg">

  <!-- Apply saved theme before paint to avoid a flash -->
  <script>
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">

  {% if page.mathjax %}
  <script>
    window.MathJax = { tex: { inlineMath: [["\\(", "\\)"]], displayMath: [["\\[", "\\]"], ["$$", "$$"]] } };
  </script>
  <script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>
  {% endif %}
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ site.baseurl }}/">Shubham Kejriwal</a>
      <nav class="site-nav" id="site-nav" aria-label="Main">
        {% for item in site.data.nav %}
          {% assign target = item.url | prepend: site.baseurl %}
          <a href="{{ target }}"{% if page.url == item.url %} class="active" aria-current="page"{% endif %}{% if item.external %} target="_blank" rel="noopener"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode"><i class="fas fa-circle-half-stroke"></i></button>
      <button class="icon-btn" id="nav-toggle" aria-label="Open menu" aria-controls="site-nav" aria-expanded="false"><i class="fas fa-bars"></i></button>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>© {{ site.time | date: "%Y" }} Shubham Kejriwal</span>
      <span class="footer-icons">
        <a href="mailto:{{ site.email }}" title="Email"><i class="fas fa-envelope"></i></a>
        <a href="https://github.com/perturber" title="GitHub" target="_blank" rel="noopener"><i class="fab fa-github"></i></a>
        <a href="https://orcid.org/0009-0004-5838-1886" title="ORCID" target="_blank" rel="noopener"><i class="fab fa-orcid"></i></a>
        <a href="https://inspirehep.net/authors/2739234" title="INSPIRE-HEP" target="_blank" rel="noopener"><i class="fas fa-book"></i></a>
        <a href="https://www.linkedin.com/in/shubham-kejriwal-919976192/" title="LinkedIn" target="_blank" rel="noopener"><i class="fab fa-linkedin"></i></a>
      </span>
    </div>
  </footer>

  <script>
    (function () {
      var nav = document.getElementById("site-nav");
      var navBtn = document.getElementById("nav-toggle");
      navBtn.addEventListener("click", function () {
        var open = nav.classList.toggle("open");
        navBtn.setAttribute("aria-expanded", open);
        navBtn.innerHTML = open ? '<i class="fas fa-xmark"></i>' : '<i class="fas fa-bars"></i>';
      });

      var root = document.documentElement;
      document.getElementById("theme-toggle").addEventListener("click", function () {
        var current = root.getAttribute("data-theme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        var next = current === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
      });

      // Open external links in a new tab
      document.querySelectorAll("main a[href^='http']").forEach(function (a) {
        if (a.hostname !== location.hostname && !a.hasAttribute("target")) {
          a.target = "_blank";
          a.rel = "noopener noreferrer";
        }
      });
    })();
  </script>
</body>
</html>
